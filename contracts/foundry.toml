[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[etherscan]
base-sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
